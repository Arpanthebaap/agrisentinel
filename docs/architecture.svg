<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AgriSentinel architecture</title>
<desc>Orchestrator agent on Gemini routes to four specialized sub-agents, backed by Memory Bank, Agent Registry, and Google Cloud infrastructure, producing farmer, insurer, and carbon-buyer facing reports.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="20" y="20" width="640" height="90" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="40" y="45" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Inputs (per growing cycle)</text>
<text x="40" y="68" font-family="sans-serif" font-size="12" fill="#0C447C">Sentinel-1 SAR, Sentinel-2 optical, SWIR/thermal bands, soil sensors, Pub/Sub trigger events</text>
<text x="40" y="88" font-family="sans-serif" font-size="12" fill="#0C447C">Farmer / insurer / carbon-buyer app requests via Cloud Run API</text>

<line x1="340" y1="110" x2="340" y2="150" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="140" y="150" width="400" height="80" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="180" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Orchestrator agent</text>
<text x="340" y="200" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle">Gemini 3.5 + ADK / GenKit</text>
<text x="340" y="218" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle">plans which sub-agents to invoke this cycle</text>

<line x1="220" y1="230" x2="130" y2="270" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="290" y1="230" x2="290" y2="270" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="390" y1="230" x2="390" y2="270" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="460" y1="230" x2="550" y2="270" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="30" y="270" width="150" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="105" y="296" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">Plot Disaggregation</text>
<text x="105" y="312" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">spectral unmixing</text>
<text x="105" y="326" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">+ SR upscaling</text>

<rect x="200" y="270" width="150" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="275" y="296" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">Cloud Piercing</text>
<text x="275" y="312" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">SAR to optical</text>
<text x="275" y="326" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">U-Net / Pix2Pix</text>

<rect x="370" y="270" width="150" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="445" y="296" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">Stress Sentinel</text>
<text x="445" y="312" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">ET / LST anomaly</text>
<text x="445" y="326" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">pre-visual alert</text>

<rect x="500" y="270" width="150" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="575" y="296" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">Carbon Verification</text>
<text x="575" y="312" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">physics-informed</text>
<text x="575" y="326" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">SOC estimator</text>

<line x1="340" y1="350" x2="340" y2="390" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="60" y="390" width="240" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="180" y="415" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1B0C" text-anchor="middle">Memory Bank</text>
<text x="180" y="433" font-family="sans-serif" font-size="11" fill="#712B13" text-anchor="middle">cross-season plot state (Firestore)</text>

<rect x="380" y="390" width="240" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="415" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1B0C" text-anchor="middle">Agent Registry</text>
<text x="500" y="433" font-family="sans-serif" font-size="11" fill="#712B13" text-anchor="middle">catalog, versioning, cross-team reuse</text>

<line x1="340" y1="460" x2="340" y2="500" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="140" y="500" width="400" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="527" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">Google Cloud infra</text>
<text x="340" y="545" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">Cloud Run agent services + Pub/Sub triggers</text>

<line x1="340" y1="560" x2="340" y2="580" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="340" y="600" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">Farmer / insurer / carbon-buyer report</text>
</svg>
